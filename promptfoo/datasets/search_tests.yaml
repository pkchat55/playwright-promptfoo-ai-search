- vars:
    question: "What is the parental leave policy?"
  assert:
    - type: contains-any
      value: ["parental leave", "parental"]
    - type: javascript
      value: "output.length >= 30 && output.toLowerCase().includes('parental')"

- vars:
    question: "How many vacation days do employees receive?"
  assert:
    - type: contains-any
      value: ["vacation", "annual leave"]
    - type: javascript
      value: "output.length >= 30 && (output.toLowerCase().includes('vacation') || output.toLowerCase().includes('annual leave'))"

- vars:
    question: "What is the Mars policy for teleportation?"
  assert:
    - type: contains
      value: "could not find a reliable answer"
    - type: javascript
      value: "output.toLowerCase().includes('could not find a reliable answer')"
